<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="body-login">
<div class="container card login-card position-absolute top-50 start-50 translate-middle">
    <div class="row h-100">
        <div class="col-6">
            <img src="https://assets.nflxext.com/ffe/siteui/vlv3/6e4b7575-5e77-4cbc-b380-6b57b4cb2652/web/VN-en-20261012-TRIFECTA-perspective_9231e8bd-eb36-4cd4-b07f-57ce35085e89_large.jpg" alt="filmlibrary"> <!-- film library thing -->
        </div>
        <div class="col-6 d-flex justify-content-center align-items-center">
            <form class="w-50">
                <h1 class="text-center">Sign up</h1>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Username">Username</label>
                    <input id="Username" class="form-control"  name="Username" type="text">
                </div>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Email">Email</label>
                    <input id="Email" class="form-control" name="Email" type="text">
                </div>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Password">Password</label>
                    <input id="Password" class="form-control"  name="Password" type="text">
                </div>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Password-confirm">Confirm password</label>
                    <input id="Password-confirm" class="form-control"  name="Password-confirm" type="text">
                </div>
                <div class="input-group mb-3 text-center w-100 justify-content-center">
                    <button class="btn btn-primary" onclick="if(CheckSignUp()){this.form.submit()}">Sign up</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>

    let CheckSignUp = async function () {
        event.preventDefault();

        const username = document.getElementById("Username").value.trim();
        const email = document.getElementById("Email").value.trim();
        const password = document.getElementById("Password").value;
        const confirmPassword = document.getElementById("Password-confirm").value;

        // Check that all fields are filled in
        if (!username || !email || !password || !confirmPassword) {
            alert("Please fill in all fields.");
            return false;
        }

        // Check password confirmation
        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return false;
        }

        // Basic password length check
        if (password.length < 8) {
            alert("Password must be at least 8 characters long.");
            return false;
        }

        try {
            // Validate the email using the API
            const response = await fetch(
                "https://api.api-ninjas.com/v1/validateemail?email=" +
                encodeURIComponent(email),
                {
                    headers: {
                        "X-Api-Key": decodeURIComponent(escape(atob("MUdva0RtcTRmeFNaS0FDSmN3QlU4eUpyekNudjllZWJJWG9kN25jMw==")))
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!data.is_valid) {
                alert("Please enter a valid email address.");
                return false;
            }

            // All checks passed
            alert("Sign-up validation successful!");

            // Submit the form
            document.querySelector("form").submit();
            return true;

        } catch (error) {
            console.error("Email validation failed:", error);
            alert("Unable to validate your email right now. Please try again.");
            return false;
        }
    };
>
</body>
</html>
