<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="body-login">
<div class="container card login-card position-absolute top-50 start-50 translate-middle">
    <div class="row h-100">
        <div class="col-6">
            <img src="https://assets.nflxext.com/ffe/siteui/vlv3/6e4b7575-5e77-4cbc-b380-6b57b4cb2652/web/VN-en-20261012-TRIFECTA-perspective_9231e8bd-eb36-4cd4-b07f-57ce35085e89_large.jpg" alt="filmlibrary">
        </div>
        <div class="col-6 d-flex justify-content-center align-items-center">
            <form class="w-50">
                <h1 class="text-center">Welcome back!</h1>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Username">Username</label>
                    <input id="Username" class="form-control"  name="Username" type="text">
                </div>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="Password">Password</label>
                    <input id="Password" class="form-control"  name="Password" type="text">
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="RememberMe">
                    <label class="form-check-label" for="RememberMe">
                        Remember me
                    </label>
                </div>
                <div class="input-group mb-3 text-center w-100 justify-content-center">
                    <button type="submit" class="btn btn-primary">Log in</button>
                </div>
                <div class="input-group mb-3 text-center w-100 justify-content-center">
                    <p>New? <a href="#">Create an account</a> <br> <a href="#">Forgot my password</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
